<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藝境漫遊：名畫中的迴響 (ArtScape 2D/3D)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* 啟動封面 Overlay */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 15, 25, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; text-align: center;
    }
    #start-screen h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    #start-screen p { font-size: 1.1rem; margin-bottom: 2rem; color: #ccc; max-width: 600px; line-height: 1.6; }
    #start-btn {
      padding: 12px 36px; font-size: 1.2rem; font-weight: bold; color: #111;
      background: #ffd700; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,215,0,0.4); transition: transform 0.2s, background 0.2s;
    }
    #start-btn:hover { transform: scale(1.05); background: #fff; }

    /* UI 提示層 */
    #ui-layer {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      pointer-events: none; text-shadow: 1px 1px 4px #000;
    }
    #prompt-text {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75); padding: 12px 24px; border-radius: 20px;
      font-size: 1.1rem; border: 1px solid #ffd700; display: none; z-index: 10;
    }
    #back-btn {
      position: absolute; top: 20px; right: 20px; z-index: 20;
      padding: 10px 20px; background: rgba(255,255,255,0.2); border: 1px solid #fff;
      color: #fff; border-radius: 8px; cursor: pointer; display: none; backdrop-filter: blur(5px);
    }
    #back-btn:hover { background: rgba(255,255,255,0.4); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-screen">
    <h1>藝境漫遊：名畫中的迴響</h1>
    <p>控制 3D 小角色在展廳漫遊。<br>靠近畫作按下 <strong>[Enter]</strong> 穿越進入 2D 360° 動態環繞畫中世界！</p>
    <button id="start-btn">開始展覽遊覽</button>
  </div>

  <div id="ui-layer">
    <h2 id="gallery-title">3D 主展覽廳</h2>
    <p id="controls-hint">操作指示: WASD 或 方向鍵 移動角色</p>
  </div>

  <div id="prompt-text">按下 [Enter] 進入畫中世界</div>
  <button id="back-btn">退出畫中世界</button>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer;
    let player;
    let galleryGroup; // 用於包裹「主展廳、牆面與所有畫框」的群組
    let isPanoramaMode = false;
    let currentPainting = null;
    let keys = {};
    let panoramaMesh, panoramaMaterial;
    let audioContext, audioSource;
    let clock = new THREE.Clock();

    // 5 幅名畫數據庫
    const paintingsData = [
      { id: 'starry_night', name: '梵谷《星夜》', x: -8, z: -14, bg: 'assets/panoramas/starry_night.jpg', audio: 'assets/audio/starry_night.mp3', effect: 'shader' },
      { id: 'last_supper', name: '達文西《最後的晚餐》', x: -4, z: -14, bg: 'assets/panoramas/last_supper.jpg', audio: 'assets/audio/last_supper.mp3', effect: 'normal' },
      { id: 'scream', name: '孟克《吶喊》', x: 0, z: -14, bg: 'assets/panoramas/scream.jpg', audio: 'assets/audio/scream.mp3', effect: 'normal' },
      { id: 'great_wave', name: '葛飾北齋《神奈川沖浪裏》', x: 4, z: -14, bg: 'assets/panoramas/great_wave.jpg', audio: 'assets/audio/great_wave.mp3', effect: 'normal' },
      { id: 'grand_jatte', name: '秀拉《大碗島的星期天下午》', x: 8, z: -14, bg: 'assets/panoramas/grand_jatte.jpg', audio: 'assets/audio/grand_jatte.mp3', effect: 'normal' }
    ];

    // --- 梵谷《星夜》專用 GLSL Shader ---
    const starryVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const starryFragmentShader = `
      uniform sampler2D uTexture;
      uniform float uTime;
      varying vec2 vUv;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }

      void main() {
        vec2 uv = vUv;
        float skyMask = smoothstep(0.35, 0.9, uv.y);
        vec2 vortexCenter = vec2(0.5, 0.7);
        vec2 distVec = uv - vortexCenter;
        float dist = length(distVec);
        
        float angle = sin(uTime * 0.8 - dist * 4.0) * 0.08 * skyMask;
        float cosA = cos(angle); float sinA = sin(angle);
        vec2 rotatedUv = vec2(cosA * distVec.x - sinA * distVec.y, sinA * distVec.x + cosA * distVec.y) + vortexCenter;

        float n = noise(rotatedUv * 12.0 + vec2(uTime * 0.3, uTime * 0.2));
        vec2 finalUv = rotatedUv + vec2(cos(n * 6.28), sin(n * 6.28)) * 0.012 * skyMask;

        vec4 color = texture2D(uTexture, finalUv);
        float brightness = (color.r + color.g + color.b) / 3.0;
        if (brightness > 0.65 && uv.y > 0.4) {
          float shimmer = sin(uTime * 2.5 + brightness * 10.0) * 0.08;
          color.rgb += vec3(shimmer * 0.5, shimmer * 0.4, shimmer * 0.1);
        }
        gl_FragColor = color;
      }
    `;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      // 建立展廳群組（便於進入畫中時一鍵隱藏）
      galleryGroup = new THREE.Group();
      scene.add(galleryGroup);

      // 地板與牆面
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x22222e }));
      floor.rotation.x = -Math.PI / 2;
      galleryGroup.add(floor);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshStandardMaterial({ color: 0x333344 }));
      backWall.position.set(0, 5, -15);
      galleryGroup.add(backWall);

      // 任天堂風小人物
      player = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x3498db }));
      body.position.y = 0.6;
      player.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
      head.position.y = 1.5;
      player.add(head);
      galleryGroup.add(player);

      // 生成 5 個畫框
      paintingsData.forEach(data => {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.2, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
        frame.position.set(data.x, 3.5, data.z + 0.1);
        galleryGroup.add(frame);

        const canvas = new THREE.Mesh(new THREE.PlaneGeometry(2, 3), new THREE.MeshBasicMaterial({ color: 0xdddddd }));
        canvas.position.set(data.x, 3.5, data.z + 0.22);
        galleryGroup.add(canvas);
      });

      camera.position.set(0, 5, 8);
      camera.lookAt(0, 2, 0);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

      // 2D 360 度環繞控制 (拖曳旋轉視角)
      let isDragging = false, previousMousePosition = { x: 0, y: 0 };
      container.addEventListener('mousedown', () => isDragging = true);
      container.addEventListener('mouseup', () => isDragging = false);
      container.addEventListener('mousemove', e => {
        if (isPanoramaMode && isDragging) {
          const deltaX = e.clientX - previousMousePosition.x;
          camera.rotation.y -= deltaX * 0.004; // 控制水平 360 度環繞
        }
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        initAudio();
      });

      document.getElementById('back-btn').addEventListener('click', exitPanorama);

      animate();
    }

    function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playAudioForPainting(audioUrl) {
      if (!audioContext) return;
      fetch(audioUrl)
        .then(res => res.arrayBuffer())
        .then(data => audioContext.decodeAudioData(data))
        .then(buffer => {
          if (audioSource) audioSource.stop();
          audioSource = audioContext.createBufferSource();
          audioSource.buffer = buffer;
          audioSource.loop = true;
          audioSource.connect(audioContext.destination);
          audioSource.start(0);
        }).catch(() => {});
    }

    // --- 進入 2D 環繞畫中世界（隱藏畫框與展廳）---
    function enterPanorama(paintingData) {
      isPanoramaMode = true;
      currentPainting = paintingData;

      // 1. 完全隱藏 3D 主展廳、角色與畫框
      galleryGroup.visible = false;

      // 2. 更新 UI 提示
      document.getElementById('prompt-text').style.display = 'none';
      document.getElementById('back-btn').style.display = 'block';
      document.getElementById('gallery-title').innerText = `進入畫中：${paintingData.name}`;
      document.getElementById('controls-hint').innerText = '按住滑鼠左鍵左右拖曳，可 360° 全景環繞畫作';

      // 3. 建立 2D 360 度環繞背景球體 (Equirectangular Panorama)
      const panoGeo = new THREE.SphereGeometry(500, 60, 40);
      panoGeo.scale(-1, 1, 1);

      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(paintingData.bg, texture => {
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;

        if (paintingData.effect === 'shader') {
          // 啟用定製的星夜流動 Shader
          panoramaMaterial = new THREE.ShaderMaterial({
            vertexShader: starryVertexShader,
            fragmentShader: starryFragmentShader,
            uniforms: { uTexture: { value: texture }, uTime: { value: 0.0 } },
            side: THREE.DoubleSide
          });
        } else {
          panoramaMaterial = new THREE.MeshBasicMaterial({ map: texture });
        }
        panoramaMesh.material = panoramaMaterial;
      });

      panoramaMesh = new THREE.Mesh(panoGeo, new THREE.MeshBasicMaterial({ color: 0x050515 }));
      scene.add(panoramaMesh);

      camera.position.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);

      playAudioForPainting(paintingData.audio);
    }

    // --- 退出畫中世界（還原畫框與展廳）---
    function exitPanorama() {
      isPanoramaMode = false;

      // 1. 移除全景背景，重新顯示展廳與畫框
      if (panoramaMesh) scene.remove(panoramaMesh);
      galleryGroup.visible = true;

      if (audioSource) audioSource.stop();

      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('gallery-title').innerText = '3D 主展覽廳';
      document.getElementById('controls-hint').innerText = '操作指示: WASD 或 方向鍵 移動角色';

      camera.position.set(player.position.x, 5, player.position.z + 8);
      camera.lookAt(player.position.x, 2, player.position.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      if (!isPanoramaMode) {
        // 小人物展廳移動
        const speed = 0.15;
        if (keys['w'] || keys['arrowup']) player.position.z -= speed;
        if (keys['s'] || keys['arrowdown']) player.position.z += speed;
        if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
        if (keys['d'] || keys['arrowright']) player.position.x += speed;

        player.position.x = Math.max(-13, Math.min(13, player.position.x));
        player.position.z = Math.max(-13, Math.min(13, player.position.z));

        camera.position.x = player.position.x;
        camera.position.z = player.position.z + 8;
        camera.lookAt(player.position.x, 1.5, player.position.z);

        // 碰撞與提示
        let nearPainting = null;
        paintingsData.forEach(p => {
          const dist = player.position.distanceTo(new THREE.Vector3(p.x, 0, p.z));
          if (dist < 3.0) nearPainting = p;
        });

        const promptUI = document.getElementById('prompt-text');
        if (nearPainting) {
          promptUI.innerText = `按下 [Enter] 穿越進入 ${nearPainting.name}`;
          promptUI.style.display = 'block';
          if (keys['enter']) enterPanorama(nearPainting);
        } else {
          promptUI.style.display = 'none';
        }
      } else {
        // 更新《星夜》Shader 的動態時間參數
        if (panoramaMesh && panoramaMesh.material.uniforms) {
          panoramaMesh.material.uniforms.uTime.value = elapsedTime;
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
